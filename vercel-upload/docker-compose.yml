services:
  mysql:
    image: mysql:8.0
    container_name: ppt-speech-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: ppt_speech
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: ppt-speech-api
    environment:
      DATABASE_URL: mysql+pymysql://root:123456@mysql:3306/ppt_speech?charset=utf8mb4
      SECRET_KEY: change-me-in-production
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_API_KEY: ""
      LLM_MODEL: deepseek-chat
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  web:
    build: ./frontend
    container_name: ppt-speech-web
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql-data:
